<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Weight-loss coach</title>
<style>
  :root{
    --bg:#0f1115; --panel:#161922; --panel2:#1d2130; --line:#262b3a;
    --text:#e6e9f0; --muted:#8b93a7;
    --user:#2d6cdf; --accent:#4ade80; --warn:#fbbf24;
    --coach:#f472b6; --intake:#60a5fa; --metrics:#a78bfa;
    --workout:#34d399; --meal:#fbbf24; --report:#f87171; --safety:#94a3b8;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);
       font:15px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
       height:100vh;display:flex;flex-direction:column;overflow:hidden}
  header{padding:14px 20px;border-bottom:1px solid var(--line);
         display:flex;align-items:center;gap:12px;flex-shrink:0}
  header h1{font-size:15px;margin:0;font-weight:600;letter-spacing:.2px}
  header .sub{color:var(--muted);font-size:13px}
  header button{margin-left:auto;background:var(--panel2);color:var(--text);
    border:1px solid var(--line);border-radius:7px;padding:7px 13px;
    font-size:13px;cursor:pointer;font-family:inherit}
  header button:hover{background:#252a3a}

  main{flex:1;display:flex;min-height:0}
  #chat{flex:1;overflow-y:auto;padding:24px 20px 8px;display:flex;
        flex-direction:column;gap:14px}
  .wrap{max-width:760px;width:100%;margin:0 auto}

  .msg{display:flex;flex-direction:column;gap:5px;max-width:82%}
  .msg.me{align-self:flex-end;align-items:flex-end}
  .who{font-size:11px;color:var(--muted);font-weight:600;letter-spacing:.4px;
       text-transform:uppercase;padding:0 3px}
  .bub{background:var(--panel);border:1px solid var(--line);
       border-radius:14px;padding:11px 15px;overflow-wrap:anywhere}
  .bub>*:first-child{margin-top:0}
  .bub>*:last-child{margin-bottom:0}
  .bub p{margin:8px 0}
  .msg.me .bub{background:var(--user);border-color:transparent;color:#fff;
       white-space:pre-wrap}
  .bub h1,.bub h2,.bub h3{font-size:15px;margin:14px 0 6px;font-weight:650}
  .bub h1:first-child,.bub h2:first-child{margin-top:0}
  .bub table{border-collapse:collapse;margin:8px 0;font-size:13px;width:100%}
  .bub td,.bub th{border:1px solid var(--line);padding:5px 9px;text-align:left}
  .bub code{background:#0b0d12;padding:1px 5px;border-radius:4px;font-size:13px}
  .bub ul,.bub ol{margin:6px 0;padding-left:20px}
  .bub li{margin:2px 0}
  .bub strong{font-weight:650}
  .bub hr{border:0;border-top:1px solid var(--line);margin:12px 0}

  /* activity ticker */
  .tick{align-self:flex-start;display:flex;align-items:center;gap:8px;
        font-size:12px;color:var(--muted);padding:2px 4px}
  .tick .dot{width:7px;height:7px;border-radius:50%;background:var(--accent);
             animation:pulse 1.2s ease-in-out infinite}
  @keyframes pulse{0%,100%{opacity:.3}50%{opacity:1}}
  .tick code{background:var(--panel2);padding:1px 6px;border-radius:4px;
             color:var(--text);font-size:11px}

  /* right rail */
  aside{width:250px;border-left:1px solid var(--line);padding:18px 16px;
        overflow-y:auto;flex-shrink:0;background:var(--panel)}
  aside h2{font-size:11px;text-transform:uppercase;letter-spacing:.7px;
           color:var(--muted);margin:0 0 10px;font-weight:600}
  aside h2:not(:first-child){margin-top:22px}
  .agent{display:flex;align-items:center;gap:8px;padding:5px 7px;
         border-radius:6px;font-size:13px;color:var(--muted);
         transition:background .2s,color .2s}
  .agent .pip{width:8px;height:8px;border-radius:50%;background:#333a4d;
              flex-shrink:0;transition:background .2s}
  .agent.on{color:var(--text);background:var(--panel2)}
  .agent.live{background:#243044}
  .agent.indent{margin-left:14px}
  .agent.wf{font-style:italic}
  .agent.wf .label:after{content:" ·  no model";font-style:normal;
                         font-size:10px;color:#5c6478}
  .key{display:flex;align-items:center;gap:8px;padding:4px 7px;font-size:13px;
       color:#4a5164;font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
  .key.on{color:var(--accent)}
  .key .tickmark{opacity:0}
  .key.on .tickmark{opacity:1}

  footer{border-top:1px solid var(--line);padding:14px 20px;flex-shrink:0}
  form{max-width:760px;margin:0 auto;display:flex;gap:10px}
  input{flex:1;background:var(--panel2);border:1px solid var(--line);
        border-radius:9px;padding:11px 14px;color:var(--text);font:inherit;
        outline:none}
  input:focus{border-color:#3d4a63}
  input:disabled{opacity:.5}
  form button{background:var(--user);color:#fff;border:0;border-radius:9px;
    padding:11px 20px;font:inherit;font-weight:600;cursor:pointer}
  form button:disabled{opacity:.4;cursor:default}
  .err{color:#f87171;font-size:13px;padding:8px 4px}
  @media(max-width:760px){aside{display:none}}
</style>
</head>
<body>
<header>
  <h1>Weight-loss coach</h1>
  <span class="sub">7 agents · Google ADK</span>
  <button id="reset">New session</button>
</header>

<main>
  <div id="chat"><div class="wrap" id="stream"></div></div>
  <aside>
    <h2>Agents</h2>
    <div id="agents"></div>
    <h2>Session state</h2>
    <div id="keys"></div>
  </aside>
</main>

<footer>
  <form id="form">
    <input id="input" placeholder="Starting…" autocomplete="off" disabled>
    <button id="send" disabled>Send</button>
  </form>
</footer>

<script>
const AGENTS = [
  {id:"coach",            label:"coach",            depth:0, wf:false},
  {id:"intake_agent",     label:"intake_agent",     depth:1, wf:false},
  {id:"plan_pipeline",    label:"plan_pipeline",    depth:1, wf:true },
  {id:"metrics_agent",    label:"metrics_agent",    depth:2, wf:false},
  {id:"specialists",      label:"specialists",      depth:2, wf:true },
  {id:"workout_designer", label:"workout_designer", depth:3, wf:false},
  {id:"meal_designer",    label:"meal_designer",    depth:3, wf:false},
  {id:"report_agent",     label:"report_agent",     depth:2, wf:false},
  {id:"safety_reviewer",  label:"safety_reviewer",  depth:3, wf:false},
];
const COLOR = {coach:"--coach",intake_agent:"--intake",metrics_agent:"--metrics",
  workout_designer:"--workout",meal_designer:"--meal",report_agent:"--report",
  safety_reviewer:"--safety"};
const KEYS = ["profile","targets","workout_plan","meal_plan","final_plan"];

const $ = s => document.querySelector(s);
const stream=$("#stream"), input=$("#input"), sendBtn=$("#send");
let sessionId=null;

// --- right rail ------------------------------------------------------------
function buildRail(){
  $("#agents").innerHTML = AGENTS.map(a =>
    `<div class="agent${a.depth?" indent":""}${a.wf?" wf":""}" data-a="${a.id}"
      style="margin-left:${a.depth*13}px">
      <span class="pip"></span><span class="label">${a.label}</span></div>`).join("");
  $("#keys").innerHTML = KEYS.map(k =>
    `<div class="key" data-k="${k}"><span class="tickmark">✓</span>${k}</div>`).join("");
}
function markAgent(name,{live=false}={}){
  const el=document.querySelector(`.agent[data-a="${name}"]`); if(!el) return;
  el.classList.add("on");
  const c=COLOR[name]; if(c) el.querySelector(".pip").style.background=`var(${c})`;
  document.querySelectorAll(".agent.live").forEach(e=>e.classList.remove("live"));
  if(live) el.classList.add("live");
}
function markKey(k){
  const el=document.querySelector(`.key[data-k="${k}"]`);
  if(el) el.classList.add("on");
}

// --- tiny markdown (headings, bold, tables, lists, rules) ------------------
function md(src){
  const esc = s => s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
  const lines = esc(src).split("\n");
  let out=[], list=null, tbl=null;
  const closeList=()=>{ if(list){out.push(`</${list}>`);list=null;} };
  const closeTbl =()=>{ if(tbl){out.push("</table>");tbl=null;} };
  for(let raw of lines){
    const line=raw.trimEnd();
    if(/^\s*\|.*\|\s*$/.test(line)){
      const cells=line.trim().slice(1,-1).split("|").map(c=>c.trim());
      if(cells.every(c=>/^:?-{2,}:?$/.test(c))) continue;   // separator row
      closeList();
      if(!tbl){ out.push("<table>"); tbl=1; }
      out.push("<tr>"+cells.map(c=>`<td>${inline(c)}</td>`).join("")+"</tr>");
      continue;
    }
    closeTbl();
    let m;
    if((m=line.match(/^(#{1,6})\s+(.*)$/))){
      closeList(); const lv=Math.min(m[1].length,3);
      out.push(`<h${lv}>${inline(m[2])}</h${lv}>`);
    } else if(/^\s*[-*]{3,}\s*$/.test(line)){
      closeList(); out.push("<hr>");
    } else if((m=line.match(/^\s*[-*]\s+(.*)$/))){
      if(list!=="ul"){closeList();out.push("<ul>");list="ul";}
      out.push(`<li>${inline(m[1])}</li>`);
    } else if((m=line.match(/^\s*\d+[.)]\s+(.*)$/))){
      if(list!=="ol"){closeList();out.push("<ol>");list="ol";}
      out.push(`<li>${inline(m[1])}</li>`);
    } else if(line.trim()===""){
      closeList();
    } else { closeList(); out.push(`<p>${inline(line)}</p>`); }
  }
  closeList(); closeTbl();
  return out.join("\n").replace(/<\/p>\n<p>/g," ");
}
function inline(s){
  return s.replace(/\*\*(.+?)\*\*/g,"<strong>$1</strong>")
          .replace(/(^|[^*])\*(?!\s)([^*]+?)\*/g,"$1<em>$2</em>")
          .replace(/`(.+?)`/g,"<code>$1</code>");
}

// --- chat ------------------------------------------------------------------
function bubble(author,text,mine){
  const el=document.createElement("div");
  el.className="msg"+(mine?" me":"");
  const c=COLOR[author];
  el.innerHTML=`<div class="who" ${c?`style="color:var(${c})"`:""}>${author}</div>
                <div class="bub">${mine?text.replace(/</g,"&lt;"):md(text)}</div>`;
  stream.appendChild(el); scroll(); return el;
}
function ticker(html){
  const el=document.createElement("div");
  el.className="tick"; el.innerHTML=`<span class="dot"></span>${html}`;
  stream.appendChild(el); scroll(); return el;
}
function scroll(){ $("#chat").scrollTop = $("#chat").scrollHeight; }
function busy(on){
  input.disabled=on; sendBtn.disabled=on;
  input.placeholder = on ? "Working…" : "Type your answer…";
  if(!on) input.focus();
}

async function newSession(){
  buildRail(); stream.innerHTML=""; busy(true);
  input.placeholder="Starting…";
  const t=ticker("starting session…");
  try{
    const r=await fetch("/api/session",{method:"POST"});
    const d=await r.json();
    sessionId=d.session_id; t.remove();
    markAgent("coach"); markAgent("intake_agent",{live:true});
    bubble("coach",d.greeting,false);
  }catch(e){ t.remove(); stream.insertAdjacentHTML("beforeend",
    `<div class="err">Could not reach the server — is serve_ui.py running?</div>`); }
  busy(false);
}

async function send(text){
  bubble("you",text,true); busy(true);
  let tick=ticker("thinking…");
  const res=await fetch("/api/chat",{method:"POST",
    headers:{"Content-Type":"application/json"},
    body:JSON.stringify({session_id:sessionId,text})});
  const reader=res.body.getReader(); const dec=new TextDecoder(); let buf="";
  while(true){
    const {value,done}=await reader.read(); if(done) break;
    buf+=dec.decode(value,{stream:true});
    const chunks=buf.split("\n\n"); buf=chunks.pop();
    for(const c of chunks){
      if(!c.startsWith("data: ")) continue;
      const ev=JSON.parse(c.slice(6));
      if(ev.type==="transfer"){
        markAgent(ev.author); markAgent(ev.target,{live:true});
        tick.innerHTML=`<span class="dot"></span><code>${ev.author}</code> → <code>${ev.target}</code>`;
      } else if(ev.type==="tool"){
        markAgent(ev.author,{live:true});
        if(ev.tool==="safety_reviewer") markAgent("safety_reviewer");
        tick.innerHTML=`<span class="dot"></span><code>${ev.author}</code> calls <code>${ev.tool}</code>`;
      } else if(ev.type==="state"){
        markKey(ev.key);
        tick.innerHTML=`<span class="dot"></span>wrote <code>${ev.key}</code> to state`;
      } else if(ev.type==="message"){
        markAgent(ev.author,{live:true});
        tick.remove(); bubble(ev.author,ev.text,false); tick=ticker("thinking…");
      } else if(ev.type==="error"){
        tick.remove(); stream.insertAdjacentHTML("beforeend",
          `<div class="err">${ev.text}</div>`); scroll();
      } else if(ev.type==="done"){ tick.remove(); }
    }
  }
  tick.remove(); busy(false);
}

$("#form").addEventListener("submit",e=>{
  e.preventDefault();
  const t=input.value.trim(); if(!t||!sessionId) return;
  input.value=""; send(t);
});
$("#reset").addEventListener("click",newSession);
newSession();
</script>
</body>
</html>
